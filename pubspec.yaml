name: dio_resilience
description: Coordinated Dio interceptor for retry, timeout, circuit breaker, rate limit, fallback, and OAuth token refresh. Strategies share state so they don't fight each other.
version: 0.1.0
homepage: https://github.com/NarekManukyan/dio_resilience
repository: https://github.com/NarekManukyan/dio_resilience
issue_tracker: https://github.com/NarekManukyan/dio_resilience/issues

topics:
  - dio
  - http
  - network
  - auth
  - interceptor

environment:
  sdk: ^3.4.0

dependencies:
  dio: ^5.4.0
  meta: ^1.12.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
